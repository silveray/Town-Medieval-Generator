[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
mde_core = { path = "crates/mde_core" }
glam = { version = "0.33.2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Dev builds: keep our code debuggable but optimise dependencies (Bevy is slow unoptimised).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
